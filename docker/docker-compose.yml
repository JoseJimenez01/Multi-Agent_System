x-langfuse-s3: &langfuse-s3
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse-events
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-media
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"

x-langfuse-core: &langfuse-core
  DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:-langfuse_user}:${LANGFUSE_POSTGRES_PASSWORD:-langfuse_pass}@langfuse-postgres:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
  CLICKHOUSE_URL: http://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-clickhouse}@langfuse-clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-clickhouse}@langfuse-clickhouse:9000/default
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
  REDIS_CONNECTION_STRING: redis://langfuse-redis:6379
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL: "false"
  <<: *langfuse-s3

services:
  # =====================
  # Qdrant (base vectorial)
  # =====================
  qdrant:
    image: qdrant/qdrant:v${QDRANT_VERSION:-1.12.0}
    container_name: mas-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - mas-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =====================
  # Langfuse (observabilidad LLM)
  # Configuración persistente: docker/.env
  # =====================
  langfuse-postgres:
    image: postgres:16-alpine
    container_name: mas-langfuse-db
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:-langfuse_user}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-langfuse_pass}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:-langfuse}
    ports:
      - "${LANGFUSE_DB_PORT:-5433}:5432"
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    networks:
      - mas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_POSTGRES_USER:-langfuse_user} -d ${LANGFUSE_POSTGRES_DB:-langfuse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  langfuse-zookeeper:
    image: zookeeper:3.9
    container_name: mas-langfuse-zk
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=0.0.0.0:2888:3888;2181
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    volumes:
      - langfuse_zookeeper_data:/data
    networks:
      - mas-network
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: mas-langfuse-ch
    depends_on:
      langfuse-zookeeper:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/password.xml
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/cluster.xml
    ports:
      - "${CLICKHOUSE_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9002}:9000"
    networks:
      - mas-network
    healthcheck:
      test: ["CMD", "clickhouse-client", "--host=127.0.0.1", "--password=${CLICKHOUSE_PASSWORD:-clickhouse}", "--query=SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-redis:
    image: redis:7-alpine
    container_name: mas-langfuse-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - langfuse_redis_data:/data
    networks:
      - mas-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  langfuse-minio:
    image: minio/minio:latest
    container_name: mas-langfuse-minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - langfuse_minio_data:/data
    networks:
      - mas-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  langfuse-createbuckets:
    image: minio/mc:latest
    depends_on:
      langfuse-minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://langfuse-minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb local/langfuse-events --ignore-existing &&
      mc mb local/langfuse-media --ignore-existing &&
      mc mb local/langfuse-exports --ignore-existing &&
      echo 'Buckets created'
      "
    networks:
      - mas-network

  langfuse:
    image: ghcr.io/langfuse/langfuse:latest
    container_name: mas-langfuse
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"
    environment:
      <<: *langfuse-core
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
    networks:
      - mas-network

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    container_name: mas-langfuse-worker
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    environment:
      <<: *langfuse-core
    networks:
      - mas-network

  # =====================
  # PostgreSQL (app principal - banco)
  # =====================
  postgres:
    image: postgres:16-alpine
    container_name: mas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mas_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../src/database/postgres/banco_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../src/database/postgres/banco_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - mas-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qdrant_data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_zookeeper_data:
  langfuse_redis_data:
  langfuse_minio_data:
  postgres_data:

networks:
  mas-network:
    driver: bridge
